# Experiment configuration
name: "ms1-mz-200_peaks-sqrt-clf_run_retrain" # ms1 # retrain finetuning
# name: "ms1-mz-200_peaks-sqrt-clf_run" # ms1 # online finetuning
# name: "ms1-mz-pos-200_peaks-sqrt" # ms1

# Data configuration
data:
  train_dir: "train_mzml"
  val_dir: "val_mzml"
  batch_size: 1024   # 2000 OOMs the 44GB L40S (fp32); with bf16-mixed there is headroom
                     # again, but raise training.accumulate_grad_batches rather than this
                     # if you need memory back without changing the effective batch.
  max_num_peaks: 200

# Model configuration
model:
  d_model: 512 #Previously 256
  nhead: 8
  dim_feedforward: 1024 #Previously 512
  n_layers: 9 #Previously 6
  dropout: 0.1
  n_bins: 1200
  bin_mz_min: 300
  bin_mz_max: 1500
  masked_peaks_fraction: 0.3
  
# Optimizer settings
optimizer:
  lr: 0.0005 # 0.0003  — peak LR of the one-cycle schedule
  warmup_iters: 2000  # diverse data: gentler start to avoid early loss spikes
  # Length of the OneCycleLR schedule in optimizer steps. It must be at least the
  # run's TOTAL steps: OneCycleLR raises mid-run once stepped past it.
  # `null` (recommended) = the model takes trainer.estimated_stepping_batches, which
  # knows the real dataloader length; train.py's own exact count is the fallback for
  # the unsized --no_shuffle path. Do NOT hand-compute this as n_spectra/batch_size
  # — see the total_steps note in CLAUDE.md for why that undercounts.
  # An explicit int here overrides both, for an experiment that needs a fixed schedule.
  total_steps: null
  div_factor: 25.0          # start LR = lr / 25
  final_div_factor: 10000.0 # final LR = start LR / 1e4
                            # (spelled out: YAML 1.1 reads `1.0e4` as a *string*)

# Training settings
training:
  checkpoint_path: "./train_checkpoints"
  max_epochs: 1000 # 200
  gradient_clip_val: 5
  accelerator: "gpu"
  devices: 1
  # Activations are (batch, n_peaks, d_model) and dominate memory, so they scale
  # linearly with d_model: at batch 1024 / 200 peaks, d_model 512 needs ~44GB in fp32
  # and OOMs the L40S. bf16-mixed roughly halves that and is ~1.5-2x faster. Weights,
  # Adam state, the m/z sinusoidal encoding and the cross-entropy all stay fp32.
  # Record the precision in the run name — nothing else in the pipeline does, so an
  # fp32 and a bf16 run of the same data are otherwise indistinguishable in results.csv.
  precision: "bf16-mixed"
  # Effective batch = data.batch_size * this. Raise it (and halve batch_size) to cut
  # activation memory without touching the effective batch or the LR schedule.
  accumulate_grad_batches: 1
