# Experiment configuration
name: "MS1-mz-200_peaks-pride_500"

# Data configuration
data:
  train_dir: "train_mzml" # FIXME: not used properly. Fix or remove.
  val_dir: "val_mzml" # FIXME: not used properly. Fix or remove.
  batch_size: 1000
  max_num_peaks: 200

# Model configuration
model:
  d_model: 256
  nhead: 8
  dim_feedforward: 512
  n_layers: 6
  dropout: 0.1
  n_bins: 1200
  bin_mz_min: 300
  bin_mz_max: 1500
  masked_peaks_fraction: 0.3
  
# Optimizer settings
optimizer:
  lr: 0.0005       # peak LR of the one-cycle schedule
  warmup_steps: 1000
  total_steps: 64000  
  div_factor: 25.0          # initial LR = lr / div_factor
  final_div_factor: 10000.0 # final LR = initial_lr / final_div_factor

# Training settings
training:
  checkpoint_path: "./train_checkpoints"
  max_epochs: 100
  gradient_clip_val: 5
  accelerator: "gpu"
  devices: 1
