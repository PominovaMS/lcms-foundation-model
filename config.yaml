# Experiment configuration
name: "ms1-mz-200_peaks-sqrt-clf_run_retrain" # ms1 # retrain finetuning
# name: "ms1-mz-200_peaks-sqrt-clf_run" # ms1 # online finetuning
# name: "ms1-mz-pos-200_peaks-sqrt" # ms1

# Data configuration
data:
  train_dir: "train_mzml"
  val_dir: "val_mzml"
  batch_size: 1024   # 2000 OOMs the 44GB L40S (fp32); lower this further if still tight
  max_num_peaks: 200

# Model configuration
model:
  d_model: 256
  nhead: 8
  dim_feedforward: 512
  n_layers: 6
  dropout: 0.1
  n_bins: 1200
  bin_mz_min: 300
  bin_mz_max: 1500
  masked_peaks_fraction: 0.3
  
# Optimizer settings
optimizer:
  lr: 0.0005 # 0.0003  — peak LR of the one-cycle schedule
  warmup_iters: 2000  # diverse data: gentler start to avoid early loss spikes
  # Length of the OneCycleLR schedule in optimizer steps. It must be at least the
  # run's TOTAL steps: OneCycleLR raises once stepped past it.
  # `null` = derive in train.py from the run's stop criterion:
  #   --max_steps if given (exact, used as-is), else
  #   ceil(n_train_spectra / batch_size) * max_epochs padded ~2%, because that
  #   spectra-count estimate can be off by a batch or two and an undercount raises.
  # Set an explicit int here only to override the derivation for an experiment.
  total_steps: null
  div_factor: 25.0          # start LR = lr / 25
  final_div_factor: 10000.0 # final LR = start LR / 1e4
                            # (spelled out: YAML 1.1 reads `1.0e4` as a *string*)

# Training settings
training:
  checkpoint_path: "./train_checkpoints"
  max_epochs: 1000 # 200
  gradient_clip_val: 5
  accelerator: "gpu"
  devices: 1
