# Experiment configuration
name: "ms1-mz-200_peaks-sqrt-clf_run_retrain" # ms1 # retrain finetuning
# name: "ms1-mz-200_peaks-sqrt-clf_run" # ms1 # online finetuning
# name: "ms1-mz-pos-200_peaks-sqrt" # ms1

# Data configuration
data:
  train_dir: "train_mzml"
  val_dir: "val_mzml"
  batch_size: 512    # Halved from 1024 when dim_feedforward went to 2048 — see the
                     # memory note under training. training.accumulate_grad_batches is
                     # 2 to compensate, so the effective batch stays 1024, the value the
                     # LR schedule was tuned at. 2000 OOMs the 44GB L40S (fp32); with
                     # bf16-mixed there is headroom again, but raise
                     # training.accumulate_grad_batches rather than this if you need
                     # memory back without changing the effective batch.
  max_num_peaks: 200

# Model configuration
model:
  d_model: 512 #Previously 256
  nhead: 8
  dim_feedforward: 2048 #Previously 1024 (2x d_model); 4x is the conventional ratio
  n_layers: 9 #Previously 6
  dropout: 0.1
  n_bins: 1200
  bin_mz_min: 300
  bin_mz_max: 1500
  masked_peaks_fraction: 0.3
  
# Optimizer settings
optimizer:
  lr: 0.0005 # 0.0003  — peak LR of the one-cycle schedule
  warmup_iters: 2000  # diverse data: gentler start to avoid early loss spikes
  # Length of the OneCycleLR schedule in optimizer steps. It must be at least the
  # run's TOTAL steps: OneCycleLR raises mid-run once stepped past it.
  # `null` (recommended) = the model takes trainer.estimated_stepping_batches, which
  # knows the real dataloader length; train.py's own exact count is the fallback for
  # the unsized --no_shuffle path. Do NOT hand-compute this as n_spectra/batch_size
  # — see the total_steps note in CLAUDE.md for why that undercounts.
  # An explicit int here overrides both, for an experiment that needs a fixed schedule.
  total_steps: null
  div_factor: 25.0          # start LR = lr / 25
  final_div_factor: 10000.0 # final LR = start LR / 1e4
                            # (spelled out: YAML 1.1 reads `1.0e4` as a *string*)

# Training settings
training:
  checkpoint_path: "./train_checkpoints"
  max_epochs: 1000 # 200
  gradient_clip_val: 5
  accelerator: "gpu"
  # Single GPU. Read by train.py and by both eval entry points; the slurm scripts ask
  # for a matching --gres=gpu:1.
  devices: 1
  # Saved-for-backward activations are roughly
  #   n_layers * batch * (max_num_peaks+1) * d_model * 2B * (10 + 2.5*dim_feedforward/d_model)
  # so they scale linearly with d_model, dim_feedforward and batch. At batch 1024 /
  # 200 peaks, d_model 512 / ff 1024 needs ~28GB in bf16 and ~56GB in fp32, which is
  # what OOM'd the 44GB L40S. bf16-mixed roughly halves it and is ~1.5-2x faster.
  # Weights, Adam state, the m/z sinusoidal encoding and the cross-entropy stay fp32.
  # ff 1024->2048 takes that to ~37GB at batch 1024, hence batch 512 above with
  # accumulate_grad_batches 2 to keep the effective batch at 1024.
  # Record the precision in the run name — nothing else in the pipeline does, so an
  # fp32 and a bf16 run of the same data are otherwise indistinguishable in results.csv.
  precision: "bf16-mixed"
  # Effective batch = data.batch_size * this. Raise it (and halve batch_size) to cut
  # activation memory without touching the effective batch or the LR schedule.
  # 512 x 2 = 1024, the effective batch the LR schedule was tuned at; one optimizer
  # step still consumes 1024 spectra, so warmup_iters keeps its meaning.
  accumulate_grad_batches: 2
