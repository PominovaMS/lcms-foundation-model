name: lcms-foundation
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26,<2.3  # numba (via depthcharge/spectrum_utils) needs NumPy <= 2.2
  - numba>=0.59
  - scipy
  - pandas
  - pyarrow
  - matplotlib
  - pytorch-lightning=2.4.*
  - tensorboard
  - einops
  - pydantic>=2
  - hydra-core>=1.3
  - pytest
  - mypy
  - black
  - ruff
  - pre-commit
  - thermorawfileparser  # RAW -> mzML converter (bioconda), used by scripts/ingest_pxd.py
  - pip:
      - depthcharge-ms
      - ppx  # ProteomeXchange/PRIDE downloader, used by scripts/ingest_pxd.py
